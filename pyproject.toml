[project]
name = "deep_investigator_build_pipeline"
version = "0.1.0"
description = "deep_investigator_build_pipeline using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.11,<2.0.0",
    "edge-tts>=7,<8",
    "faster-whisper>=1.1,<2",
    "firecrawl-py<=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_investigator_build_pipeline"]
include = ["deep_investigator_build_pipeline/*.json"]

[tool.hatch.build.targets.wheel.force-include]
"src/dl_tools/dl_tools" = "dl_tools"

[tool.crewai]
type = "flow"
definition = "src/deep_investigator_build_pipeline/flow_direct.json"
project_id = "408af2ca-5fdd-4f63-8e22-b5887b1d18c3"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
